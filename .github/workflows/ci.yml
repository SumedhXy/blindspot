name: BlindSpot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-audit-and-tests:
    name: Backend Test & Security Suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Suite (39 Tests across 5 Scenario Domains)
      run: |
        python -m pytest backend/tests/ -v

  frontend-build:
    name: Standalone Frontend Build & TypeScript Validation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'project_blindspot/frontend/package-lock.json'

    - name: Install Frontend Dependencies
      run: |
        cd project_blindspot/frontend
        npm ci

    - name: Validate TypeScript & Build Production SPA
      run: |
        cd project_blindspot/frontend
        npm run build
