# CodeRabbit Configuration File
# Documentation: https://docs.coderabbit.ai/guides/configure-coderabbit

version: 2
language: "en-US"

early_access: false

reviews:
  profile: "chill" # Options: "chill", "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "develop"

  path_filters:
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/.pytest_cache/**"
    - "!**/*.db"

  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    eslint:
      enabled: true

chat:
  auto_reply: true
